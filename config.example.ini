; Скопируйте в config.ini. Не храните реальные токены в git.

[printer]
ip = 192.168.1.50
; запасное имя принтера и логические принтеры для A4 (Windows)
name = Canon_Long
name_long = Canon_Long
name_short = Canon_Short
name_none = Canon_None
; simulate = true   ; без реального принтера (проверка интерфейса)

[paper]
default = A4
; форматы, доступные в интерфейсе (A3 нужны логические принтеры ниже)
available = A4,A3
fit_to_paper = true
; Имена должны ТОЧНО совпадать с именами принтеров в Windows (Get-Printer). Нет A3 — удалите a3_* и поставьте available = A4.
; Логические принтеры Windows для A3 (создайте как для A4: LPR + подсчёт байт,
; общесистемные, т.к. служба работает в сеансе 0)
a3_long = Canon_A3_Long
a3_short = Canon_A3_Short
a3_none = Canon_A3_None
; сколько единиц счётчика Canon даёт одна сторона A3 (на многих аппаратах 2)
a3_counter_weight = 1

[print]
booklet = none
batch_size = 16
cooldown_minutes = 6
duplex = long
copies = 1
chunks_per_batch = 1

[snmp]
community = public
port = 161
timeout = 3
retries = 2
wake_timeout_sec = 600
print_watchdog_min = 120
; сколько минут без прироста счётчика до признания пачки потерянной
lost_job_min = 120

[telegram]
token =
; администраторы (полный доступ), через запятую
chat_id =
; только просмотр и уведомления
viewer_ids =
download_timeout = 300

[web]
enabled = true
host = 0.0.0.0
port = 8765
; token пуст = сгенерируется и сохранится в data/web_token.txt
token =

[service]
; halt — после сбоя задания очередь встаёт на паузу; continue — идти к следующему
on_failure = halt
history_days = 14
